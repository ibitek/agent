<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kaelia Local Browser</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>Kaelia Local Browser</h1>
  <p id="status" role="status">Share the current tab for up to 10 minutes.</p>
  <div class="actions">
    <button id="share" type="button">Share this tab</button>
    <button id="stop" type="button" hidden>Stop</button>
  </div>
</main>
<script src="popup.js"></script>
</html>
